<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Корзина — Улов 100 Пудов</title>
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B3D5C'/%3E%3Cellipse cx='15' cy='17' rx='8' ry='5' fill='%23FF8A3D'/%3E%3Cpath d='M23 17l6-4v8z' fill='%23FF8A3D'/%3E%3C/svg%3E">
  
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .cart-page { padding-block: 40px 80px; min-height: 60vh; }
    .cart-table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
    .cart-table th { text-align: left; padding: 12px; border-bottom: 2px solid var(--c-border); color: var(--c-muted); font-size: 14px; }
    .cart-table td { padding: 16px 12px; border-bottom: 1px solid var(--c-border); vertical-align: middle; }
    .cart-item__title { font-weight: 600; color: var(--c-primary); }
    .cart-item__brand { font-size: 12px; color: var(--c-accent); text-transform: uppercase; }
    .cart-qty { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--c-border); border-radius: var(--radius-sm); padding: 4px; }
    .cart-qty button { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: var(--c-bg-soft); border-radius: 4px; font-weight: bold; }
    .cart-qty span { width: 24px; text-align: center; font-weight: 600; }
    .cart-remove { color: var(--c-danger); font-size: 13px; font-weight: 600; }
    .cart-summary { display: flex; justify-content: flex-end; align-items: center; gap: 32px; padding-top: 20px; }
    .cart-total { font-size: 24px; font-weight: 800; color: var(--c-primary); }
  </style>
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="cart-page">
    <div class="container">
      <h1 class="page-head__title" style="margin-bottom: 24px;">Корзина</h1>
      <div id="cart-content"></div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <div class="toast" id="toast" role="status"></div>
  
  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/cart-page.js"></script>
</body>
</html>
