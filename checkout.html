<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Оформление заказа — Улов 100 Пудов</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B3D5C'/%3E%3Cellipse cx='15' cy='17' rx='8' ry='5' fill='%23FF8A3D'/%3E%3Cpath d='M23 17l6-4v8z' fill='%23FF8A3D'/%3E%3C/svg%3E">
  
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .checkout-page { padding-block: 40px 80px; }
    .checkout-layout { display: grid; grid-template-columns: 1fr 380px; gap: 40px; align-items: start; }
    .checkout-form { display: flex; flex-direction: column; gap: 20px; background: #fff; padding: 32px; border-radius: var(--radius); border: 1px solid var(--c-border); }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 14px; font-weight: 600; color: var(--c-text-soft); }
    .form-group input[type="text"], .form-group input[type="tel"], .form-group textarea { padding: 12px 16px; border: 1.5px solid var(--c-border); border-radius: var(--radius-sm); outline: none; font-family: inherit; }
    .form-group input[type="text"]:focus, .form-group input[type="tel"]:focus, .form-group textarea:focus { border-color: var(--c-accent); }
    .order-summary { background: var(--c-bg-soft); padding: 24px; border-radius: var(--radius); position: sticky; top: 100px; }
    .order-summary__title { font-weight: 800; margin-bottom: 16px; font-size: 18px; }
    .order-summary__item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
    .order-summary__total { display: flex; justify-content: space-between; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--c-border); font-weight: 800; font-size: 20px; }
  </style>
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="checkout-page">
    <div class="container">
      <h1 class="page-head__title" style="margin-bottom: 24px;">Оформление заказа</h1>
      
      <div class="checkout-layout">
        <form class="checkout-form" id="checkout-form">
          <div class="form-group">
            <label for="name">Ваше имя *</label>
            <input type="text" id="name" name="name" required placeholder="Иван">
          </div>
          <div class="form-group">
            <label for="phone">Номер телефона *</label>
            <input type="tel" id="phone" name="phone" required placeholder="+7 (999) 000-00-00">
          </div>
          
          <div class="form-group" style="margin-top: 10px;">
            <label>Способ получения *</label>
            <div style="display: flex; gap: 20px; margin-top: 8px;">
              <label style="display: flex; align-items: center; gap: 8px; font-weight: normal; cursor: pointer;">
                <input type="radio" name="delivery" value="Самовывоз" required checked style="width: 18px; height: 18px; accent-color: var(--c-accent);"> Самовывоз
              </label>
              <label style="display: flex; align-items: center; gap: 8px; font-weight: normal; cursor: pointer;">
                <input type="radio" name="delivery" value="Доставка" required style="width: 18px; height: 18px; accent-color: var(--c-accent);"> Доставка
              </label>
            </div>
          </div>

          <!-- ПРЕДУПРЕЖДЕНИЕ О ЗОНЕ ДОСТАВКИ -->
          <div style="background: var(--c-cta-soft); border-left: 4px solid var(--c-cta); padding: 12px 16px; border-radius: 4px; margin-top: -4px;">
            <p style="font-size: 13.5px; color: var(--c-cta-dark); margin: 0; font-weight: 500;">
              <strong>Внимание:</strong> Доставка осуществляется <u>только</u> по г. Луганск и Станице.
            </p>
          </div>

          <!-- Блок для адреса (по умолчанию скрыт) -->
          <div class="form-group" id="address-group" hidden style="margin-top: 10px;">
            <label for="address">Адрес доставки *</label>
            <input type="text" id="address" name="address" placeholder="Город, улица, дом, квартира">
          </div>

          <div class="form-group" style="margin-top: 10px;">
            <label for="comment">Комментарий к заказу</label>
            <textarea id="comment" name="comment" rows="3" placeholder="Пожелания..."></textarea>
          </div>
          
          <!-- Скрытые поля для Web3Forms -->
          <input type="hidden" name="access_key" value="773e5883-3977-432a-91c8-8a06343a78ce">
          <input type="hidden" name="subject" value="Новый заказ с сайта Улов 100 Пудов">
          
          <button type="submit" class="btn btn--cta btn--lg" id="submit-btn">Отправить заказ</button>
          <p style="font-size: 13px; color: var(--c-muted); text-align: center; margin-top: 10px;">Нажимая кнопку, вы соглашаетесь с политикой конфиденциальности.</p>
        </form>

        <div class="order-summary" id="order-summary"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/checkout.js"></script>
</body>
</html>
